name: Apply supplier master feature

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update app and rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          page = Path('app/page.tsx')
          text = page.read_text()
          marker = "type Master = { id:string; name:string; active?:boolean; weightKg?:number; category?:string };"
          supplier_type = "type Supplier = { id:string; name:string; contactPerson?:string; phone?:string; address?:string; gstNumber?:string; notes?:string; active?:boolean };"
          if supplier_type not in text:
              text = text.replace(marker, marker + "\n" + supplier_type)

          new_inward = r'''function Inward({lang,appUser}:{lang:Lang;appUser:AppUser}){
 const yarns=useCollection<Master>('master_yarns');
 const weights=useCollection<Master>('master_package_weights');
 const suppliers=useCollection<Supplier>('suppliers');
 const receipts=useCollection<any>('goods_receipts');
 const [pack,setPack]=useState<'pote'|'box'>('pote');
 const [qty,setQty]=useState(0);
 const [weight,setWeight]=useState(50);
 const [yarn,setYarn]=useState('');
 const [supplierId,setSupplierId]=useState('');
 const [file,setFile]=useState<File|null>(null);
 const [supplierOpen,setSupplierOpen]=useState(false);
 const [supplierSearch,setSupplierSearch]=useState('');
 const [supplierForm,setSupplierForm]=useState({name:'',contactPerson:'',phone:'',address:'',gstNumber:'',notes:''});
 const [savingSupplier,setSavingSupplier]=useState(false);
 const options=weights.length?weights.filter(w=>w.active!==false).map(w=>Number(w.weightKg)).filter(Boolean):[50,60];
 const total=qty*weight;
 const activeSuppliers=suppliers.filter(s=>s.active!==false);
 const filteredSuppliers=activeSuppliers.filter(s=>`${s.name} ${s.contactPerson||''} ${s.phone||''} ${s.gstNumber||''}`.toLowerCase().includes(supplierSearch.toLowerCase()));
 const selectedSupplier=activeSuppliers.find(s=>s.id===supplierId);
 async function saveSupplier(){
  if(!db||!supplierForm.name.trim()||savingSupplier)return;
  setSavingSupplier(true);
  try{
   const name=supplierForm.name.trim();
   const id=slug(name);
   await setDoc(doc(db!,'suppliers',id),{name,contactPerson:supplierForm.contactPerson.trim(),phone:supplierForm.phone.trim(),address:supplierForm.address.trim(),gstNumber:supplierForm.gstNumber.trim().toUpperCase(),notes:supplierForm.notes.trim(),active:true,createdAt:serverTimestamp(),createdBy:appUser.uid},{merge:true});
   await writeAudit(appUser,'supplier',`Added/updated supplier ${name}`);
   setSupplierId(id);
   setSupplierForm({name:'',contactPerson:'',phone:'',address:'',gstNumber:'',notes:''});
   setSupplierOpen(false);
  }catch(e:any){alert(e?.message||'Unable to save supplier.')}finally{setSavingSupplier(false);}
 }
 async function toggleSupplier(s:Supplier){
  if(!db)return;
  try{await setDoc(doc(db!,'suppliers',s.id),{active:s.active===false,updatedAt:serverTimestamp(),updatedBy:appUser.uid},{merge:true});await writeAudit(appUser,'supplier',`${s.active===false?'Activated':'Deactivated'} supplier ${s.name}`);}catch(e:any){alert(e?.message||'Unable to update supplier.');}
 }
 async function save(){
  if(!db||!yarn||qty<=0){alert('Select yarn type and quantity.');return;}
  if(!supplierId){alert('Select a supplier or add a new supplier.');return;}
  try{
   let url='';
   if(file&&storage){const r=ref(storage,`gate-passes/${Date.now()}-${file.name}`);await uploadBytes(r,file);url=await getDownloadURL(r)}
   const supplierName=selectedSupplier?.name||'';
   const receipt=await addDoc(collection(db!,'goods_receipts'),{supplierId,supplierName,date:localDate(),yarnLabel:yarn,packaging:pack,packageWeightKg:weight,packageQty:qty,totalWeightKg:total,gatePassUrl:url,createdBy:appUser.uid,createdAt:serverTimestamp()});
   await runTransaction(db!,async tx=>{const sr=doc(db!,'stock_items',slug(yarn));const s=await tx.get(sr);const d=s.exists()?s.data() as Partial<StockItem>:{};tx.set(sr,{yarnLabel:yarn,availableKg:Number(d.availableKg||0)+total,reservedKg:Number(d.reservedKg||0),poteCount:Number(d.poteCount||0)+(pack==='pote'?qty:0),boxCount:Number(d.boxCount||0)+(pack==='box'?qty:0),updatedAt:serverTimestamp()},{merge:true});tx.set(doc(collection(db!,'stock_transactions')),{type:'inward',receiptId:receipt.id,supplierId,supplierName,yarnLabel:yarn,qtyKg:total,packageQty:qty,packageWeightKg:weight,createdBy:appUser.uid,createdAt:serverTimestamp()})});
   await writeAudit(appUser,'goods_receipt',`${yarn} +${total} kg from ${supplierName}`);
   setQty(0);setYarn('');setSupplierId('');setFile(null);alert('Goods received successfully.')
  }catch(e:any){alert(e?.message||'Unable to receive goods.')}
 }
 return <div className="page">
  <section className="card">
   <div className="card-head"><div><h3>{lang==='mr'?'माल आवक':'Receive goods'}</h3><p className="muted">{lang==='mr'?'सप्लायर निवडा आणि आवक नोंदवा':'Select supplier and record incoming material'}</p></div><button className="secondary" onClick={()=>setSupplierOpen(true)}><Plus size={17}/>Supplier List</button></div>
   <div className="form">
    <label>Supplier<select value={supplierId} onChange={e=>setSupplierId(e.target.value)}><option value="">Select supplier</option>{activeSuppliers.map(s=><option key={s.id} value={s.id}>{s.name}{s.phone?` · ${s.phone}`:''}</option>)}</select></label>
    {selectedSupplier&&<div className="selected-supplier"><strong>{selectedSupplier.name}</strong><small>{selectedSupplier.contactPerson||'No contact person'} {selectedSupplier.phone?`· ${selectedSupplier.phone}`:''} {selectedSupplier.gstNumber?`· GST ${selectedSupplier.gstNumber}`:''}</small></div>}
    <label>Batch / Yarn type<select value={yarn} onChange={e=>setYarn(e.target.value)}><option value="">Select</option>{yarns.filter(y=>y.active!==false).map(y=><option key={y.id} value={y.name}>{y.name}</option>)}</select></label>
    <div className="tw"><label>Packaging<select value={pack} onChange={e=>setPack(e.target.value as 'pote'|'box')}><option value="pote">Pote / Bori</option><option value="box">Box</option></select></label><label>Weight per package<select value={weight} onChange={e=>setWeight(Number(e.target.value))}>{options.map(x=><option key={x} value={x}>{x} kg</option>)}</select></label></div>
    <label>Quantity<input type="number" min="1" value={qty||''} onChange={e=>setQty(Number(e.target.value))}/></label>
    <div className="total"><span>Total weight</span><b>{total} kg</b></div>
    <label className="upload"><Camera size={18}/> Gate Pass / Delivery Note<input type="file" accept="image/*" capture="environment" onChange={e=>setFile(e.target.files?.[0]||null)}/><small>{file?.name||'Tap to capture or choose image'}</small></label>
    <button className="primary" onClick={save}><Save size={18}/>Save inward</button>
   </div>
  </section>
  <section className="card">
   <div className="card-head"><div><h3>Supplier List</h3><p className="muted">{activeSuppliers.length} active supplier(s)</p></div><button className="primary" onClick={()=>setSupplierOpen(true)}><Plus size={17}/>Add supplier</button></div>
   <div className="search-wrap"><Search size={18}/><input className="search" placeholder="Search supplier" value={supplierSearch} onChange={e=>setSupplierSearch(e.target.value)}/></div>
   {filteredSuppliers.length?filteredSuppliers.map(s=>{const history=receipts.filter(r=>r.supplierId===s.id||(!r.supplierId&&r.supplierName===s.name));const totalKg=history.reduce((a,r)=>a+Number(r.totalWeightKg||0),0);return <div className="row" key={s.id}><div><strong>{s.name}</strong><small>{s.contactPerson||'No contact'} {s.phone?`· ${s.phone}`:''} {s.gstNumber?`· GST ${s.gstNumber}`:''}</small><small>{history.length} inward record(s) · {totalKg.toLocaleString('en-IN')} kg received</small></div><div className="row-actions"><span className="pill green">Active</span><button className="icon-btn" onClick={()=>toggleSupplier(s)}>⏸</button></div></div>}):<Empty text="No suppliers yet. Add the first supplier."/>}
  </section>
  {supplierOpen&&<Modal title="Add supplier" onClose={()=>setSupplierOpen(false)}><div className="form tw"><label>Supplier name<input value={supplierForm.name} onChange={e=>setSupplierForm({...supplierForm,name:e.target.value})}/></label><label>Contact person<input value={supplierForm.contactPerson} onChange={e=>setSupplierForm({...supplierForm,contactPerson:e.target.value})}/></label><label>Mobile<input value={supplierForm.phone} onChange={e=>setSupplierForm({...supplierForm,phone:e.target.value})}/></label><label>GST number <span className="muted">(optional)</span><input value={supplierForm.gstNumber} onChange={e=>setSupplierForm({...supplierForm,gstNumber:e.target.value})}/></label><label>Address<input value={supplierForm.address} onChange={e=>setSupplierForm({...supplierForm,address:e.target.value})}/></label><label>Notes<input value={supplierForm.notes} onChange={e=>setSupplierForm({...supplierForm,notes:e.target.value})}/></label></div><ModalActions onSave={saveSupplier}/></Modal>}
 </div>
}'''
          text, count = re.subn(r"function Inward\(\{lang,appUser\}:\{lang:Lang;appUser:AppUser\}\)\{.*?\nfunction Stock", new_inward + "\nfunction Stock", text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not locate Inward component for replacement')
          page.write_text(text)

          rules = Path('firestore/firestore.rules')
          r = rules.read_text()
          line = "    match /suppliers/{id} { allow read, create, update: if manager(); allow delete: if owner(); }"
          if line not in r:
              r = r.replace("    match /goods_receipts/{id} { allow read, create, update: if manager(); allow delete: if owner(); }", "    match /goods_receipts/{id} { allow read, create, update: if manager(); allow delete: if owner(); }\n" + line)
          rules.write_text(r)
          Path('.github/workflows/apply-supplier-feature.yml').unlink()
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx firestore/firestore.rules .github/workflows/apply-supplier-feature.yml
          git commit -m "Add supplier master and supplier-wise inward tracking"
          git push