name: Upgrade Attendance

on:
  push:
    paths:
      - ".attendance-upgrade-trigger"

permissions:
  contents: write

jobs:
  upgrade:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace attendance module
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/page.tsx')
          text = path.read_text()
          start = text.find('function Attendance(')
          end = text.find('function Inward(', start)
          if start < 0 or end < 0:
              raise SystemExit('Attendance or Inward component boundary not found')

          replacement = r'''function Attendance({lang,role,appUser}:{lang:Lang;role:Role;appUser:AppUser}){
 const t=tAll[lang];
 const workers=useCollection<Worker>('workers');
 const [selectedDate,setSelectedDate]=useState(localDate());
 const [records,setRecords]=useState<any[]>([]);
 const [edit,setEdit]=useState<{worker:Worker;record:any|null}|null>(null);
 const [saving,setSaving]=useState(false);
 const canManualEdit=role==='owner';
 useEffect(()=>{
  if(!db)return;
  const q=query(collection(db!,'attendance'),orderBy('date','desc'),limit(500));
  return onSnapshot(q,s=>setRecords(s.docs.map(d=>({id:d.id,...d.data()}))),()=>setRecords([]));
 },[]);
 const activeWorkers=useMemo(()=>workers.filter(w=>w.active!==false),[workers]);
 const byWorker=useMemo(()=>{
  const m=new Map<string,any>();
  records.filter(r=>r.date===selectedDate).forEach(r=>m.set(r.workerId,r));
  return m;
 },[records,selectedDate]);
 function recordId(workerId:string,date:string){return `${date}_${workerId}`;}
 function asDate(value:any):Date|null{
  if(!value)return null;
  if(value?.toDate)return value.toDate();
  if(typeof value==='string'||typeof value==='number'){const d=new Date(value);return Number.isNaN(d.getTime())?null:d;}
  return null;
 }
 function timeLabel(value:any){const d=asDate(value);return d?d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'—';}
 function hoursLabel(record:any){
  const a=asDate(record?.checkIn),b=asDate(record?.checkOut);
  if(!a||!b||b<=a)return '—';
  const mins=Math.floor((b.getTime()-a.getTime())/60000);
  return `${Math.floor(mins/60)}h ${String(mins%60).padStart(2,'0')}m`;
 }
 async function mark(worker:Worker,kind:'checkIn'|'checkOut'){
  if(!db||saving)return;
  const current=byWorker.get(worker.id);
  if(kind==='checkIn'&&current?.checkIn){return;}
  if(kind==='checkOut'&&!current?.checkIn){alert(lang==='mr'?'आधी चेक-इन करा.':'Check in first.');return;}
  if(kind==='checkOut'&&current?.checkOut){return;}
  setSaving(true);
  try{
   const id=recordId(worker.id,selectedDate);
   const now=new Date().toISOString();
   await setDoc(doc(db!,'attendance',id),{workerId:worker.id,workerName:worker.name,date:selectedDate,[kind]:now,status:kind==='checkOut'?'completed':'present',updatedAt:serverTimestamp(),updatedBy:appUser.email,source:'watchman'}, {merge:true});
   await writeAudit(appUser,'attendance',`${kind==='checkIn'?'Checked in':'Checked out'} ${worker.name} on ${selectedDate}`);
  }catch(e:any){alert(e?.message||'Unable to update attendance.')}finally{setSaving(false);}
 }
 function openEdit(worker:Worker){
  const r=byWorker.get(worker.id)||null;
  setEdit({worker,record:r});
 }
 async function saveEdit(){
  if(!db||!edit)return;
  setSaving(true);
  try{
   const date=selectedDate;
   const id=recordId(edit.worker.id,date);
   const inValue=edit.record?.checkIn||null;
   const outValue=edit.record?.checkOut||null;
   const payload={workerId:edit.worker.id,workerName:edit.worker.name,date,checkIn:inValue,checkOut:outValue,status:outValue?'completed':inValue?'present':'absent',updatedAt:serverTimestamp(),updatedBy:appUser.email,source:'owner-manual'};
   await setDoc(doc(db!,'attendance',id),payload,{merge:true});
   await writeAudit(appUser,'attendance',`Manually corrected attendance for ${edit.worker.name} on ${date}`);
   setEdit(null);
  }catch(e:any){alert(e?.message||'Unable to save attendance correction.')}finally{setSaving(false);}
 }
 function toInputTime(value:any){const d=asDate(value);return d?`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`:'';}
 function setEditTime(field:'checkIn'|'checkOut',value:string){
  if(!edit)return;
  const next={...edit.record};
  next[field]=value?new Date(`${selectedDate}T${value}:00`).toISOString():null;
  setEdit({...edit,record:next});
 }
 return <div className="page">
  <div className="hero-row">
   <div><p className="muted">{lang==='mr'?'फक्त चेक-इन आणि चेक-आउट':'Simple attendance'}</p><h1>{t.attendance}</h1></div>
   <label className="date-control"><span>{lang==='mr'?'तारीख':'Date'}</span><input type="date" value={selectedDate} onChange={e=>setSelectedDate(e.target.value)}/></label>
  </div>
  <section className="card">
   <CardHeader title={lang==='mr'?'कामगार उपस्थिती':'Worker attendance'}/>
   {activeWorkers.length?activeWorkers.map(w=>{
    const r=byWorker.get(w.id); const checkedIn=!!r?.checkIn; const checkedOut=!!r?.checkOut;
    return <div className="row" key={w.id}>
      <div><strong>{w.name}</strong><small>{w.workerRole||'General Worker'} · {checkedIn?`${lang==='mr'?'इन':'In'} ${timeLabel(r.checkIn)}`:`${lang==='mr'?'चेक-इन बाकी':'Not checked in'}`} {checkedOut?` · ${lang==='mr'?'आउट':'Out'} ${timeLabel(r.checkOut)}`:''} {checkedOut?` · ${hoursLabel(r)}`:''}</small></div>
      <div className="row-actions">
       {!checkedIn&&<button className="primary attendance-action checkin" disabled={saving} onClick={()=>mark(w,'checkIn')}><Check size={17}/>{lang==='mr'?'चेक-इन':'Check in'}</button>}
       {checkedIn&&!checkedOut&&<button className="secondary attendance-action checkout" disabled={saving} onClick={()=>mark(w,'checkOut')}><Clock3 size={17}/>{lang==='mr'?'चेक-आउट':'Check out'}</button>}
       {checkedOut&&<span className="pill green">{lang==='mr'?'पूर्ण':'Complete'}</span>}
       {canManualEdit&&<button className="icon-btn" title={lang==='mr'?'उपस्थिती दुरुस्त करा':'Edit attendance'} onClick={()=>openEdit(w)}><Save size={17}/></button>}
      </div>
    </div>
   }):<Empty text={lang==='mr'?'सक्रिय कामगार नाहीत.':'No active workers.'}/>} 
  </section>
  {canManualEdit&&<p className="muted attendance-note">{lang==='mr'?'वॉचमनकडून चेक-इन/चेक-आउट राहिल्यास मालक तारीख व वेळ दुरुस्त करू शकतो.':'If the watchman forgets a check-in or check-out, the Owner can correct the date and time manually.'}</p>}
  {edit&&<Modal title={`${lang==='mr'?'उपस्थिती दुरुस्ती':'Edit attendance'} — ${edit.worker.name}`} onClose={()=>setEdit(null)}>
   <div className="form tw"><label>Date<input type="date" value={selectedDate} onChange={e=>setSelectedDate(e.target.value)}/></label><label>{lang==='mr'?'चेक-इन':'Check in'}<input type="time" value={toInputTime(edit.record?.checkIn)} onChange={e=>setEditTime('checkIn',e.target.value)}/></label><label>{lang==='mr'?'चेक-आउट':'Check out'}<input type="time" value={toInputTime(edit.record?.checkOut)} onChange={e=>setEditTime('checkOut',e.target.value)}/></label></div>
   <ModalActions onSave={saveEdit}/>
  </Modal>}
 </div>
}
'''
          path.write_text(text[:start] + replacement + text[end:])

      - name: Commit attendance upgrade
        shell: bash
        run: |
          rm -f .attendance-upgrade-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .attendance-upgrade-trigger
          git diff --cached --quiet && exit 0
          git commit -m "feat: upgrade check-in and check-out attendance"
          git push
